services:
  app:
    build: .
    image: owesome
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-owesome}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-owesome}
    networks:
      - default   # needed to publish the app's port
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owesome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-owesome}
    # No published ports: only services on the backend network can reach it.
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql/data
      # Schema scripts, run only when db-data is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  backend:
    internal: true   # no outside access in either direction

volumes:
  db-data:
